services:
  api:
    build: .
    container_name: news-credibility-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    command: uvicorn src.inference.api:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    container_name: news-credibility-ui
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    environment:
      - API_URL=http://api:8000/predict/
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
  
  mlflow:
    build: .
    container_name: news-credibility-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: mlflow ui --backend-store-uri /app/mlruns --host 0.0.0.0 --port 5000